<!DOCTYPE html>
<html lang="fil">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:; media-src 'self' file: blob:; connect-src 'none'">
  <title>Baka Bukas — Code in Motion</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage" aria-label="Baka Bukas lyric animation">
    <div class="memory" aria-hidden="true"><div id="memoryPrevious"></div><div id="memoryCurrent"></div></div>
    <div class="atmosphere" aria-hidden="true"></div>
    <div class="heart-sky" id="heartSky" aria-hidden="true"></div>
    <div class="intro" id="intro" aria-hidden="true">
      <span>A moment, kept</span>
      <em>baka bukas…</em>
    </div>
    <div class="polaroid one" aria-hidden="true">
      <!-- The numbered me/ images are preloaded here by renderer.js. -->
      <div class="photo"></div>
      <div class="handwriting">baka bukas…</div>
      <span class="photo-number">01</span>
    </div>
    <div class="polaroid two" aria-hidden="true">
      <!-- Original portraits repeat 1, 2, 3 across the five slots. -->
      <div class="photo"></div>
      <div class="handwriting">tayo naman.</div>
      <span class="photo-number">02</span>
    </div>
    <div class="lyric" id="lyric" role="img" aria-label=""></div>
  </main>
  <section class="controls" aria-label="Playback controls" lang="en">
    <div class="heading">BAKA BUKAS <span>&lt; code in motion /&gt;</span></div>
    <p class="subtitle">A few memories. A little hope.</p>
    <div class="buttons">
      <button id="playBtn" class="primary" aria-pressed="false" disabled>Play song</button>
      <button id="resetBtn">Reset</button>
      <button id="loveBtn" class="love-button" type="button" aria-label="Send floating hearts" title="Send a little love">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21S2 15 2 8.5C2 3 9 1 12 6c3-5 10-3 10 2.5C22 15 12 21 12 21Z"/></svg>
      </button>
    </div>
    <div class="transport">
      <input id="seek" type="range" min="0" max="60" step="0.01" value="0" aria-label="Position in edit, seconds" disabled>
      <output id="timeLabel" for="seek">0:00 / 1:00</output>
    </div>
    <small class="status" id="status" role="status">Loading the recording from audio…</small>
    <small class="shortcuts">Ctrl + Shift + H · hide/show &nbsp; Ctrl + Shift + Q · quit</small>
  </section>
  <audio id="audio" preload="auto" playsinline src="audio/edit.mp3" data-full-src="audio/Angela Ken - 'Baka Bukas' Official Music Video.mp3"></audio>
  <script src="timeline.js"></script>
  <script src="motion.js"></script>
  <script src="photo-sequence.js"></script>
  <script src="renderer.js"></script>
  <script src="hearts.js"></script>
</body>
</html>
